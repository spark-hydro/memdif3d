name: Build memdif3d

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.toolchain.compiler }} ${{ matrix.toolchain.version }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        toolchain:
          - { compiler: gcc, version: 13 }
        include:
          - build_type: Release
            toolchain: { compiler: intel, version: "2025.2" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      - name: Configure
        run: cmake -B build -D CMAKE_Fortran_COMPILER=${{ env.FC }} -D CMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel 4

      - name: Check binary
        run: |
          file build/memdif3d
          build/memdif3d --version

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  docker:
    name: docker image ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [full, slim]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the image
        run: docker build --target ${{ matrix.target }} -t memdif3d:ci --build-arg VERSION="$(git describe --tags --always)" .

      - name: Version, release and debug builds
        run: |
          docker run --rm memdif3d:ci memdif3d --version | grep -q "Release"
          docker run --rm memdif3d:ci memdif3d-debug --version | grep -q "Debug"

      - name: Short run of the example and a plot from the Python tools
        run: |
          mkdir run
          RUN="docker run --rm --user $(id -u):$(id -g) -v $PWD/run:/work memdif3d:ci"
          $RUN memdif3d /opt/memdif3d/data/reduced_matrix/rm.nam --nperiods 1 --steps-per-period 20 --fresh
          test -s run/field_001.csv
          $RUN animate_3d.py /work --nam /opt/memdif3d/data/reduced_matrix/rm.nam --out /work/solute3d.html 2> run/err.txt
          test -s run/solute3d.html

      - name: The full image installs nothing at run time, the slim image does
        run: |
          if [ "${{ matrix.target }}" = full ]; then ! grep -q "first use" run/err.txt; else grep -q "first use" run/err.txt; fi
